name: Build CrawlerVision APK

on:
  push:
    paths:
      - 'source_chunks/**'
      - 'CrawlerVision_Android_Source.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild Android source archive
        shell: bash
        run: |
          if [ -d source_chunks ]; then
            cat source_chunks/*.b64 | base64 --decode > CrawlerVision_Android_Source.zip
          fi
          unzip -q CrawlerVision_Android_Source.zip

      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply button compatibility fix
        run: sed -i 's/setTextAllCaps/setAllCaps/' CrawlerVision/app/src/main/java/com/example/crawlervision/MainActivity.java

      - name: Compile sideloadable APK
        working-directory: CrawlerVision
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Store APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrawlerVision-Test-APK
          path: CrawlerVision/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp CrawlerVision/app/build/outputs/apk/debug/app-debug.apk CrawlerVision-Chapters-1-10.apk
          if gh release view crawlervision-chapter1-v1 >/dev/null 2>&1; then
            gh release upload crawlervision-chapter1-v1 CrawlerVision-Chapters-1-10.apk --clobber
          else
            gh release create crawlervision-chapter1-v1 CrawlerVision-Chapters-1-10.apk \
              --title 'CrawlerVision Chapters 1-10 APK' \
              --notes 'Sideloadable CrawlerVision APK with Chapters 1-10, 44 bundled scene illustrations, and a chapter dropdown.'
          fi
