name: Build CrawlerVision APK

on:
  push:
    paths:
      - 'CrawlerVision_APK_Cloud_Build_Kit.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 components
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract CrawlerVision project from build kit
        run: |
          mkdir -p kit
          unzip -q CrawlerVision_APK_Cloud_Build_Kit.zip -d kit
          unzip -q kit/CrawlerVision_Android_Source.zip -d .
          test -f CrawlerVision/app/build.gradle
          test -f CrawlerVision/app/src/main/AndroidManifest.xml

      - name: Build Android debug APK
        working-directory: CrawlerVision
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrawlerVision-debug-APK
          path: CrawlerVision/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp CrawlerVision/app/build/outputs/apk/debug/app-debug.apk CrawlerVision-debug.apk
          if gh release view android-test-v1 >/dev/null 2>&1; then
            gh release upload android-test-v1 CrawlerVision-debug.apk --clobber
          else
            gh release create android-test-v1 CrawlerVision-debug.apk \
              --title 'CrawlerVision Android Test v1' \
              --notes 'Debug APK for Amazon Music media-session diagnostics. Uses generic demo scenes. Real-world audiobook sync is not yet validated.'
          fi
