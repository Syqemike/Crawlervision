name: Build Legacy CrawlerVision 1.2 APK

on:
  push:
    paths:
      - 'source_chunks/**'
      - 'CrawlerVision_Android_Source.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

# This workflow rebuilds the older repository source. It does NOT build v1.12.
# It deliberately does not auto-publish a misleading "latest" GitHub Release.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild legacy Android source archive
        shell: bash
        run: |
          set -euo pipefail
          if [ -d source_chunks ] && compgen -G 'source_chunks/*.b64' >/dev/null; then
            cat source_chunks/*.b64 | base64 --decode > CrawlerVision_Android_Source.zip
          fi
          test -s CrawlerVision_Android_Source.zip
          unzip -tq CrawlerVision_Android_Source.zip
          unzip -q CrawlerVision_Android_Source.zip
          test -d CrawlerVision

      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply legacy button compatibility fix
        run: |
          path='CrawlerVision/app/src/main/java/com/example/crawlervision/MainActivity.java'
          if [ -f "$path" ]; then
            sed -i 's/setTextAllCaps/setAllCaps/' "$path"
          fi

      - name: Compile legacy debug APK
        working-directory: CrawlerVision
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Store legacy APK as workflow artifact (NOT v1.12)
        uses: actions/upload-artifact@v4
        with:
          name: CrawlerVision-1.2-Legacy-Debug-APK
          path: CrawlerVision/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
